<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI 简历润色助手</title>
    <style>
        body {
            font-family: Arial, "Microsoft YaHei", sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #f7f7f7;
        }

        h1 {
            text-align: center;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 16px;
            margin-bottom: 8px;
        }

        input, textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        textarea {
            height: 140px;
            resize: vertical;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 14px;
            font-size: 18px;
            background-color: #1677ff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:disabled {
            background-color: #999;
            cursor: not-allowed;
        }

        .result-section {
            margin-top: 16px;
        }

        .result-section h3 {
            margin-bottom: 8px;
            color: #333;
        }

        .result-box {
            background: #f0f5ff;
            padding: 16px;
            border-radius: 8px;
            white-space: pre-wrap;
            line-height: 1.7;
        }

        .error {
            background: #fff2f0;
            color: #cf1322;
            padding: 16px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<h1>AI 简历润色助手</h1>

<div class="card">
    <label for="jobTarget">目标岗位</label>
    <input id="jobTarget" value="AI应用工程师">

    <label for="resumeText">简历内容</label>
    <textarea id="resumeText">我学过Python，会调用AI接口，做过一个聊天机器人。</textarea>

    <button id="jsonBtn" onclick="polishResumeJson()">结构化优化简历</button>
    <button id="streamBtn" onclick="polishResumeStream()">流式优化简历</button>
</div>

<div class="card">
    <h2>优化结果</h2>
    <div id="result">点击上方按钮后，这里会显示 AI 返回的结果。</div>
</div>

<script>
    async function polishResumeJson() {
        const jobTarget = document.getElementById("jobTarget").value;
        const resumeText = document.getElementById("resumeText").value;
        const resultDiv = document.getElementById("result");
        const submitBtn = document.getElementById("jsonBtn");

        if (!jobTarget || !resumeText) {
            resultDiv.innerHTML = '<div class="error">请填写目标岗位和简历内容。</div>';
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = "AI 正在优化中...";
        resultDiv.innerHTML = "正在请求 AI，请稍等...";

        try {
            const response = await fetch("http://127.0.0.1:8000/polish-resume-json", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    job_target: jobTarget,
                    resume_text: resumeText
                })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.detail || "请求失败");
            }

            const data = await response.json();

            resultDiv.innerHTML = `
                <div class="result-section">
                    <h3>一、原始内容存在的问题</h3>
                    <div class="result-box">${data.problem_analysis.map(item => "• " + item).join("<br>")}</div>
                </div>

                <div class="result-section">
                    <h3>二、优化后的简历表达</h3>
                    <div class="result-box">${data.optimized_resume}</div>
                </div>

                <div class="result-section">
                    <h3>三、为什么这样修改</h3>
                    <div class="result-box">${data.reasons.map(item => "• " + item).join("<br>")}</div>
                </div>
            `;

        } catch (error) {
            resultDiv.innerHTML = `<div class="error">出错了：${error.message}</div>`;
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "优化简历";
        }
    }

async function polishResumeStream() {
    const jobTarget = document.getElementById("jobTarget").value;
    const resumeText = document.getElementById("resumeText").value;
    const resultDiv = document.getElementById("result");
    const streamBtn = document.getElementById("streamBtn");

    if (!jobTarget || !resumeText) {
        resultDiv.innerHTML = '<div class="error">请填写目标岗位和简历内容。</div>';
        return;
    }

    streamBtn.disabled = true;
    streamBtn.innerText = "AI 正在流式输出...";
    resultDiv.innerHTML = "";

    try {
        const response = await fetch("http://127.0.0.1:8000/polish-resume-stream", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                job_target: jobTarget,
                resume_text: resumeText
            })
        });

        if (!response.ok) {
            throw new Error("请求失败");
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");

        while (true) {
            const { done, value } = await reader.read();

            if (done) {
                break;
            }

            const chunk = decoder.decode(value);
            resultDiv.innerHTML += chunk.replace(/\n/g, "<br>");
        }

    } catch (error) {
        resultDiv.innerHTML = `<div class="error">出错了：${error.message}</div>`;
    } finally {
        streamBtn.disabled = false;
        streamBtn.innerText = "流式优化简历";
    }
}
</script>

</body>
</html>
