<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 简历润色助手</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

<div class="header">
    <h1>AI 简历润色助手</h1>
    <p>基于 DeepSeek 大模型，帮你把普通经历改写成更具竞争力的简历表达</p>
</div>

<!-- Input Card -->
<div class="card">
    <div class="form-group">
        <label for="jobTarget">目标岗位 <span class="hint">可选，不填则按通用场景优化</span></label>
        <input id="jobTarget" placeholder="例如：AI应用工程师、Python后端开发" maxlength="100">
    </div>

    <div class="form-group">
        <label for="resumeText">简历内容 <span class="hint">必填</span></label>
        <textarea id="resumeText" placeholder="粘贴你的原始简历内容，例如：&#10;我学过Python，会调用AI接口，做过一个聊天机器人。"></textarea>
        <div class="char-count" id="charCount">0 / 8000</div>
    </div>

    <div class="btn-row">
        <button class="btn btn-primary" id="jsonBtn">结构化优化</button>
        <button class="btn btn-secondary" id="streamBtn">流式优化</button>
    </div>
</div>

<!-- Result Card -->
<div class="card">
    <div class="tabs">
        <button class="tab-btn active" data-tab="result">优化结果</button>
        <button class="tab-btn" data-tab="history">历史记录</button>
    </div>

    <!-- Result Tab -->
    <div class="tab-panel active" id="tab-result">
        <div class="toolbar">
            <button class="icon-btn" id="copyBtn" disabled>复制结果</button>
        </div>
        <div id="result">
            <div class="empty-state">
                <div class="icon">&#x1F4DD;</div>
                <p>填写目标岗位和简历内容，然后点击优化按钮</p>
            </div>
        </div>
    </div>

    <!-- History Tab -->
    <div class="tab-panel" id="tab-history">
        <div id="historyList">
            <div class="loading-hint">
                <div class="spinner"></div>
                <span>加载中...</span>
            </div>
        </div>
    </div>
</div>

<script src="static/js/main.js"></script>
</body>
</html>
